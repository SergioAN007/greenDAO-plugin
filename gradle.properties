# greenDAO Gradle Plugin - Gradle 9 compatible build
#
# For JitPack publishing (recommended):
#   Just create a GitHub release/tag - JitPack handles the rest automatically.
#
# For custom Maven repo publishing, set preferredRepo and credentials:
#   preferredRepo=https://your-maven-repo.com/__groupId__/__artifactId__
#   preferredUsername=your-username
#   preferredPassword=your-password

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Version is set in root build.gradle

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
