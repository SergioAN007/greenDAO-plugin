apply plugin: 'kotlin'
apply plugin: 'maven-publish'

group = 'org.greenrobot'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation 'org.greenrobot:greendao-api:3.3.0'
    implementation 'org.greenrobot:greendao-generator:3.3.0'
    implementation 'org.greenrobot:greenrobot-jdt:3.20.0'
    implementation 'org.greenrobot:essentials:3.0.0-RC1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'com.natpryce:hamkrest:1.1.0.0'
}

tasks.register('javadocJar', Jar) {
    archiveClassifier = 'javadoc'
    from 'README'
}

tasks.register('sourcesJar', Jar) {
    archiveClassifier = 'sources'
    from 'README'
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/957211324/greenDAO-plugin")
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user") ?: ""
                password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.key") ?: ""
            }
        }
    }

    publications {
        maven(MavenPublication) {
            from components.java

            artifact tasks.named('javadocJar')
            artifact tasks.named('sourcesJar')

            pom {
                name = 'greenDAO Code Modifier'
                description = 'Code modifier for greenDAO ORM. Gradle 9 compatible.'
                url = 'https://github.com/957211324/greenDAO-plugin'

                licenses {
                    license {
                        name = 'GNU General Public License, Version 3'
                        url = 'http://www.gnu.org/licenses/gpl.txt'
                        distribution = 'repo'
                    }
                }

                scm {
                    url = 'https://github.com/957211324/greenDAO-plugin'
                    connection = 'scm:git@github.com:957211324/greenDAO-plugin.git'
                    developerConnection = 'scm:git@github.com:957211324/greenDAO-plugin.git'
                }
            }
        }
    }
}
