// https://docs.gradle.org/current/userguide/custom_plugins.html
apply plugin: 'kotlin'

group = 'org.greenrobot'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

def genResourcesDir = new File(buildDir, 'src/generated/resources')
def versionFile = new File(genResourcesDir, 'org/greenrobot/greendao/gradle/version.properties')

sourceSets {
    main {
        resources {
            srcDir genResourcesDir
        }
    }
}

dependencies {
    implementation gradleApi()
    implementation project(':greendao-code-modifier')
    compileOnly 'com.android.tools.build:gradle:8.7.0' // AGP 8.7+ for Gradle 9 compatibility

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
}

// puts artifact version to properties file inside resources
tasks.register('generateVersionProperties') {
    inputs.property 'version', project.version
    outputs.file versionFile

    doLast {
        versionFile.parentFile.mkdirs()
        versionFile.withWriter {
            it.write """# Generated by gradle task generateVersionProperties
version=${project.version}
"""
        }
    }
}

tasks.named('compileKotlin').configure {
    dependsOn 'generateVersionProperties'
}

// Ensure processResources runs after generateVersionProperties to avoid implicit dependency issues
tasks.named('processResources').configure {
    dependsOn 'generateVersionProperties'
}

apply plugin: 'maven-publish'

tasks.register('javadocJar', Jar) {
    archiveClassifier = 'javadoc'
    from 'README'
}

tasks.register('sourcesJar', Jar) {
    archiveClassifier = 'sources'
    from 'README'
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            artifact tasks.named('javadocJar')
            artifact tasks.named('sourcesJar')

            pom {
                name = 'greenDAO Gradle Plugin'
                description = 'Gradle Plugin for greenDAO, the light and fast ORM for Android'
                url = 'https://github.com/957211324/greenDAO-plugin'

                licenses {
                    license {
                        name = 'GNU General Public License, Version 3'
                        url = 'http://www.gnu.org/licenses/gpl.txt'
                        distribution = 'repo'
                    }
                }

                scm {
                    url = 'https://github.com/957211324/greenDAO-plugin'
                    connection = 'scm:git@github.com:957211324/greenDAO-plugin.git'
                    developerConnection = 'scm:git@github.com:957211324/greenDAO-plugin.git'
                }
            }
        }
    }
}
