buildscript {
    ext.kotlin_version = '2.2.0'

    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.gradleup.shadow:shadow-gradle-plugin:8.3.11'
    }
}

wrapper {
    distributionType Wrapper.DistributionType.ALL
}

subprojects {
    version = "3.3.2"

    repositories {
        mavenCentral()
        google()
        mavenLocal()
    }

    configurations.all {
        // Projects are using snapshot dependencies that may update more often than 24 hours.
        resolutionStrategy {
            cacheChangingModulesFor 0, 'seconds'
        }
    }

    // Ensure Kotlin and Java compile targets are consistent (Gradle 9 / Kotlin 2.x requirement)
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_11
        }
    }


}
